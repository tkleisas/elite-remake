name: CI

# Everything that has to be true of a commit: it builds on all three desktops, the simulation's tests
# pass, and the game itself starts and draws a frame from a published build.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EliteRemake.slnx

      - name: Build
        run: dotnet build EliteRemake.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/EliteRemake.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  game-runs:
    name: The game starts and draws a frame (linux-x64)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The release artifact is a self-contained build, so that is what gets exercised: if the
      # publish is missing a native library or a data file, this is where it shows
      - name: Publish
        run: >
          dotnet publish src/EliteRemake.Game -c Release -r linux-x64 --self-contained true
          -p:DebugType=none -o build/linux-x64

      # A display to draw into, and the GL and audio libraries the window asks for. SDL2 and OpenAL
      # themselves come from MonoGame's own package, inside the published folder, so nothing here
      # installs them: if the publish were missing them, this job would fail
      - name: Install a virtual display and the GL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Run the game headless and take a screenshot
        run: |
          set -o pipefail
          cd build/linux-x64
          xvfb-run -a ./EliteRemake --title --width 1024 --height 576 \
            --screenshot "$GITHUB_WORKSPACE/build/title.png" --frame 30 \
            | tee "$GITHUB_WORKSPACE/build/run.log"

      - name: Check what it reported
        run: |
          set -euo pipefail
          cat build/run.log
          grep -q "version" build/run.log
          test -s build/title.png
          echo "the game started, reported its version and wrote a $(stat -c%s build/title.png) byte frame"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-screenshot
          path: build/title.png
          if-no-files-found: warn
